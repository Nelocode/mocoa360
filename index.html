<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mocoa 360° — Copper Giant Resources Corp.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #08090a;
    color: #e0e0e0;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .viewer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1024px;
    max-height: 768px;
    overflow: hidden;
    cursor: grab;
    background: #0a0b0e;
    touch-action: none;
  }

  .viewer.grabbing { cursor: grabbing; }

  .viewer img {
    position: absolute;
    display: block;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: auto;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .viewer #imgA { z-index: 1; }
  .viewer #imgB { z-index: 2; }

  /* Loading */
  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #08090a;
    z-index: 10;
    transition: opacity 0.6s ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .loader .spinner {
    width: 40px; height: 40px;
    border: 3px solid #1a1c20;
    border-top-color: #FF002C;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loader p {
    margin-top: 16px;
    font-size: 13px;
    color: #666;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bottom bar */
  .info {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 20px;
    background: linear-gradient(transparent, rgba(8,9,10,0.9));
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #555;
    letter-spacing: 0.5px;
    z-index: 5;
  }
  .info .brand { color: #FF002C; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .info .position { color: #888; font-variant-numeric: tabular-nums; }
  .info .hint { color: #555; }

  /* Progress dots */
  .progress {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    z-index: 5;
  }
  .progress .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #333;
    transition: background 0.2s;
  }
  .progress .dot.active { background: #FF002C; }

  /* Hint */
  .hint-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .hint-overlay.show { opacity: 1; }
  .hint-overlay .arrow {
    font-size: 48px;
    color: rgba(255,255,255,0.08);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translateX(-10px); opacity: 0.08; }
    50% { transform: translateX(10px); opacity: 0.2; }
  }

  @media (max-width: 480px) {
    .info { font-size: 9px; padding: 8px 12px; }
    .info .brand { font-size: 10px; }
    .progress { bottom: 40px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="viewer" id="viewer">
    <img id="imgA" src="" alt="Mocoa 360° view">
    <img id="imgB" src="" alt="">

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Loading Mocoa 360°</p>
    </div>

    <div class="progress" id="progress"></div>

    <div class="hint-overlay" id="hintOverlay">
      <div class="arrow">⟷</div>
    </div>

    <div class="info">
      <span class="brand">Copper Giant Resources Corp.</span>
      <span class="position" id="positionLabel">0°</span>
      <span class="hint">⟵ <span id="dragHint">drag to rotate</span> ⟶</span>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── Config ──────────────────────────────────────────────────
  const TOTAL = 36;
  const STEP = 10;
  const FRAMES = Array.from({ length: TOTAL }, (_, i) => `${(i + 1) * STEP}.png`);
  const BASE = './frames/';

  // ── DOM ─────────────────────────────────────────────────────
  const viewer = document.getElementById('viewer');
  const imgA = document.getElementById('imgA');
  const imgB = document.getElementById('imgB');
  const loader = document.getElementById('loader');
  const progress = document.getElementById('progress');
  const posLabel = document.getElementById('positionLabel');
  const hintOverlay = document.getElementById('hintOverlay');
  const dragHint = document.getElementById('dragHint');

  // ── State ───────────────────────────────────────────────────
  let pos = 0;
  let prev = -1;
  let dragging = false;
  let lx = 0;
  let vel = 0;
  let lt = 0;
  let rid = null;
  let iid = null;
  let touched = false;
  let loaded = 0;
  let ppf = 0;

  function calcPPF() {
    ppf = Math.max(6, viewer.clientWidth / TOTAL);
  }

  // ── Render ──────────────────────────────────────────────────
  function render() {
    let p = ((pos % TOTAL) + TOTAL) % TOTAL;
    let idx = Math.floor(p);
    let blend = p - idx;

    let a = idx % TOTAL;
    let b = (idx + 1) % TOTAL;

    if (a !== prev) {
      imgA.src = BASE + FRAMES[a];
      prev = a;
    }
    imgB.src = BASE + FRAMES[b];
    imgB.style.opacity = blend;

    let deg = Math.round((p / TOTAL) * (TOTAL * STEP));
    posLabel.textContent = deg + '°';

    let dots = progress.children;
    for (let i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('active', i === a);
    }
  }

  function setPos(v) {
    pos = v;
    render();
  }

  // ── Pointer events on viewer ────────────────────────────────
  function getX(e) {
    return e.touches ? e.touches[0].clientX : e.clientX;
  }

  function down(e) {
    dragging = true;
    viewer.classList.add('grabbing');
    lx = getX(e);
    lt = performance.now();
    vel = 0;
    if (rid) { cancelAnimationFrame(rid); rid = null; }
    if (iid) { cancelAnimationFrame(iid); iid = null; }

    if (!touched) {
      touched = true;
      hintOverlay.classList.remove('show');
      dragHint.textContent = 'drag to rotate';
    }
  }

  function move(e) {
    if (!dragging) return;
    e.preventDefault();

    let x = getX(e);
    let dx = lx - x;

    if (Math.abs(dx) > 0.5) {
      setPos(pos + dx / ppf);
      lx = x;
    }

    vel = dx;
    lt = performance.now();
  }

  function up(e) {
    if (!dragging) return;
    dragging = false;
    viewer.classList.remove('grabbing');

    let now = performance.now();
    let dt = Math.min(now - lt, 100);

    if (Math.abs(vel) > 2 && dt > 0) {
      let v = vel * 0.12;
      function inert() {
        v *= 0.92;
        if (Math.abs(v) < 0.01) { iid = null; return; }
        setPos(pos + v);
        iid = requestAnimationFrame(inert);
      }
      inert();
    }
  }

  viewer.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);

  viewer.addEventListener('touchstart', down, { passive: true });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up, { passive: true });

  viewer.addEventListener('contextmenu', e => e.preventDefault());

  // ── Keyboard ────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      setPos(pos + (e.key === 'ArrowLeft' ? -1 : 1));
    }
  });

  // ── Preload ─────────────────────────────────────────────────
  function preload() {
    FRAMES.forEach((name, i) => {
      let img = new Image();
      img.onload = () => {
        loaded++;
        if (loaded === TOTAL) {
          loader.classList.add('hidden');
          imgA.src = BASE + FRAMES[0];
          prev = 0;
          render();
          if (!touched) setTimeout(() => hintOverlay.classList.add('show'), 800);
        }
      };
      img.src = BASE + name;
    });
  }

  // ── Init ────────────────────────────────────────────────────
  function init() {
    calcPPF();
    window.addEventListener('resize', calcPPF);

    for (let i = 0; i < TOTAL; i++) {
      let dot = document.createElement('div');
      dot.className = 'dot';
      progress.appendChild(dot);
    }

    preload();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
