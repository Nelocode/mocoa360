<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mocoa 360° — Copper Giant Resources Corp.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #08090a;
    color: #e0e0e0;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .viewer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1024px;
    max-height: 768px;
    overflow: hidden;
    cursor: grab;
    background: #0a0b0e;
    touch-action: none;
  }

  .viewer.grabbing { cursor: grabbing; }

  .viewer .img-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .viewer .img-wrap img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: auto;
    pointer-events: none;
    -webkit-user-drag: none;
    transition: none;
  }

  .viewer .img-wrap { z-index: 1; }
  .viewer .img-wrap + .img-wrap { z-index: 2; }
  .viewer .img-wrap + .img-wrap img { opacity: 0; }

  /* Loading */
  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #08090a;
    z-index: 10;
    transition: opacity 0.6s ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .loader .spinner {
    width: 40px; height: 40px;
    border: 3px solid #1a1c20;
    border-top-color: #FF002C;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loader p {
    margin-top: 16px;
    font-size: 13px;
    color: #666;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bottom bar */
  .info {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 20px;
    background: linear-gradient(transparent, rgba(8,9,10,0.9));
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #555;
    letter-spacing: 0.5px;
    z-index: 5;
  }
  .info .brand { color: #FF002C; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .info .position { color: #888; font-variant-numeric: tabular-nums; }
  .info .hint { color: #555; }

  /* Progress dots */
  .progress {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    z-index: 5;
  }
  .progress .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #333;
    transition: background 0.2s;
  }
  .progress .dot.active { background: #FF002C; }

  /* Hint */
  .hint-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .hint-overlay.show { opacity: 1; }
  .hint-overlay .arrow {
    font-size: 48px;
    color: rgba(255,255,255,0.08);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translateX(-10px); opacity: 0.08; }
    50% { transform: translateX(10px); opacity: 0.2; }
  }

  /* Zoom controls */
  .zoom-controls {
    position: absolute;
    right: 16px;
    bottom: 60px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 6;
  }
  .zoom-controls button {
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    background: rgba(8,9,10,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    line-height: 1;
  }
  .zoom-controls button:hover {
    background: rgba(255,0,44,0.2);
    color: #FF002C;
    border-color: rgba(255,0,44,0.3);
  }
  .zoom-controls button:active {
    background: rgba(255,0,44,0.35);
  }

  /* Zoom level indicator */
  .zoom-level {
    position: absolute;
    right: 68px;
    bottom: 152px;
    font-size: 11px;
    color: #555;
    font-variant-numeric: tabular-nums;
    z-index: 6;
    pointer-events: none;
    background: rgba(8,9,10,0.6);
    padding: 2px 8px;
    border-radius: 4px;
  }

  @media (max-width: 480px) {
    .info { font-size: 9px; padding: 8px 12px; }
    .info .brand { font-size: 10px; }
    .progress { bottom: 40px; }
    .zoom-controls { right: 10px; bottom: 52px; }
    .zoom-controls button { width: 34px; height: 34px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="viewer" id="viewer">
    <div class="img-wrap"><img id="imgA" src="" alt="Mocoa 360° view"></div>
    <div class="img-wrap"><img id="imgB" src="" alt=""></div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Loading Mocoa 360°</p>
    </div>

    <div class="progress" id="progress"></div>

    <div class="hint-overlay" id="hintOverlay">
      <div class="arrow">⟷</div>
    </div>

    <div class="zoom-level" id="zoomLabel">100%</div>
    <div class="zoom-controls">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">−</button>
    </div>

    <div class="info">
      <span class="brand">Copper Giant Resources Corp.</span>
      <span class="position" id="positionLabel">0°</span>
      <span class="hint">⟵ <span id="dragHint">drag to rotate</span> ⟶</span>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── Config ──────────────────────────────────────────────────
  const TOTAL = 36;
  const STEP = 10;
  const FRAMES = Array.from({ length: TOTAL }, (_, i) => `${(i + 1) * STEP}.png`);
  const BASE = './frames/';

  // ── DOM ─────────────────────────────────────────────────────
  const viewer = document.getElementById('viewer');
  const imgA = document.getElementById('imgA');
  const imgB = document.getElementById('imgB');
  const loader = document.getElementById('loader');
  const progress = document.getElementById('progress');
  const posLabel = document.getElementById('positionLabel');
  const hintOverlay = document.getElementById('hintOverlay');
  const dragHint = document.getElementById('dragHint');
  const zoomLabel = document.getElementById('zoomLabel');
  const zoomInBtn = document.getElementById('zoomIn');
  const zoomOutBtn = document.getElementById('zoomOut');

  // ── State ───────────────────────────────────────────────────
  let pos = 0;
  let prev = -1;
  let dragging = false;
  let lx = 0;
  let ly = 0;
  let vel = 0;
  let lt = 0;
  let iid = null;
  let touched = false;
  let loaded = 0;
  let ppf = 0;

  // Zoom state
  let zoom = 1;
  const ZOOM_MIN = 0.5;
  const ZOOM_MAX = 4;
  const ZOOM_STEP = 0.25;
  let panX = 0;
  let panY = 0;
  let panning = false;
  let panLX = 0;
  let panLY = 0;

  function calcPPF() {
    ppf = Math.max(6, viewer.clientWidth / TOTAL);
  }

  // ── Apply zoom + pan ────────────────────────────────────────
  function applyTransform() {
    let tx = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')';
    imgA.style.transform = tx;
    imgB.style.transform = tx;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
  }

  // ── Render ──────────────────────────────────────────────────
  function render() {
    let p = ((pos % TOTAL) + TOTAL) % TOTAL;
    let idx = Math.floor(p);
    let blend = p - idx;

    let a = idx % TOTAL;
    let b = (idx + 1) % TOTAL;

    if (a !== prev) {
      imgA.src = BASE + FRAMES[a];
      prev = a;
    }
    imgB.src = BASE + FRAMES[b];
    imgB.style.opacity = blend;

    let deg = Math.round((p / TOTAL) * (TOTAL * STEP));
    posLabel.textContent = deg + '°';

    let dots = progress.children;
    for (let i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('active', i === a);
    }
  }

  function setPos(v) {
    pos = v;
    render();
  }

  // ── Zoom ────────────────────────────────────────────────────
  function setZoom(z, cx, cy) {
    let old = zoom;
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));

    // Zoom toward cursor (pinch center)
    if (cx !== undefined) {
      let rect = viewer.getBoundingClientRect();
      let vw = viewer.clientWidth;
      let vh = viewer.clientHeight;

      // Where the cursor was in image-space before zoom
      let ratio = zoom / old;
      panX = cx - rect.left - vw / 2 - ratio * (cx - rect.left - vw / 2 - panX);
      panY = cy - rect.top - vh / 2 - ratio * (cy - rect.top - vh / 2 - panY);

      // Clamp pan to keep image in view
      clampPan();
    }

    applyTransform();
  }

  function clampPan() {
    let vw = viewer.clientWidth;
    let vh = viewer.clientHeight;
    let iw = vw * zoom;
    let ih = vh * zoom;
    let maxX = Math.max(0, (iw - vw) / 2);
    let maxY = Math.max(0, (ih - vh) / 2);
    panX = Math.min(maxX, Math.max(-maxX, panX));
    panY = Math.min(maxY, Math.max(-maxY, panY));
  }

  zoomInBtn.addEventListener('click', function() { setZoom(zoom + ZOOM_STEP); });
  zoomOutBtn.addEventListener('click', function() { setZoom(zoom - ZOOM_STEP); });

  // ── Scroll wheel zoom ───────────────────────────────────────
  viewer.addEventListener('wheel', function(e) {
    e.preventDefault();
    let delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
    setZoom(zoom + delta, e.clientX, e.clientY);
  }, { passive: false });

  // ── Pointer events ──────────────────────────────────────────
  function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
  function getY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }
  function getDist(e) {
    if (e.touches && e.touches.length === 2) {
      let dx = e.touches[0].clientX - e.touches[1].clientX;
      let dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    return 0;
  }

  let pinchDist = 0;
  let pinchZoom = 1;
  let pinchCX = 0;
  let pinchCY = 0;

  function down(e) {
    if (e.touches && e.touches.length === 2) {
      // Pinch start
      pinchDist = getDist(e);
      pinchZoom = zoom;
      pinchCX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      pinchCY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      panning = false;
      dragging = false;
      return;
    }

    if (zoom > 1) {
      panning = true;
      panLX = getX(e);
      panLY = getY(e);
      viewer.classList.add('grabbing');
      return;
    }

    dragging = true;
    viewer.classList.add('grabbing');
    lx = getX(e);
    lt = performance.now();
    vel = 0;
    if (iid) { cancelAnimationFrame(iid); iid = null; }

    if (!touched) {
      touched = true;
      hintOverlay.classList.remove('show');
      dragHint.textContent = 'drag to rotate';
    }
  }

  function move(e) {
    if (e.touches && e.touches.length === 2) {
      e.preventDefault();
      let d = getDist(e);
      if (pinchDist > 0) {
        let cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        let cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        setZoom(pinchZoom * (d / pinchDist), cx, cy);
      }
      return;
    }

    if (panning) {
      let x = getX(e);
      let y = getY(e);
      panX += (x - panLX);
      panY += (y - panLY);
      panLX = x;
      panLY = y;
      clampPan();
      applyTransform();
      return;
    }

    if (!dragging) return;
    e.preventDefault();

    let x = getX(e);
    let dx = lx - x;

    if (Math.abs(dx) > 0.5) {
      setPos(pos + dx / ppf);
      lx = x;
    }

    vel = dx;
    lt = performance.now();
  }

  function up(e) {
    if (e.touches && e.touches.length < 2) {
      pinchDist = 0;
    }

    if (panning) {
      panning = false;
      viewer.classList.remove('grabbing');
      return;
    }

    if (!dragging) return;
    dragging = false;
    viewer.classList.remove('grabbing');

    let now = performance.now();
    let dt = Math.min(now - lt, 100);

    if (Math.abs(vel) > 2 && dt > 0) {
      let v = vel * 0.12;
      function inert() {
        v *= 0.92;
        if (Math.abs(v) < 0.01) { iid = null; return; }
        setPos(pos + v);
        iid = requestAnimationFrame(inert);
      }
      inert();
    }
  }

  viewer.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);

  viewer.addEventListener('touchstart', down, { passive: true });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up, { passive: true });

  viewer.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  // ── Keyboard ────────────────────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      setPos(pos + (e.key === 'ArrowLeft' ? -1 : 1));
    }
  });

  // ── Preload ─────────────────────────────────────────────────
  function preload() {
    FRAMES.forEach(function(name) {
      let img = new Image();
      img.onload = function() {
        loaded++;
        if (loaded === TOTAL) {
          loader.classList.add('hidden');
          imgA.src = BASE + FRAMES[0];
          prev = 0;
          render();
          if (!touched) setTimeout(function() { hintOverlay.classList.add('show'); }, 800);
        }
      };
      img.src = BASE + name;
    });
  }

  // ── Init ────────────────────────────────────────────────────
  function init() {
    calcPPF();
    window.addEventListener('resize', function() {
      calcPPF();
      clampPan();
      applyTransform();
    });

    for (let i = 0; i < TOTAL; i++) {
      let dot = document.createElement('div');
      dot.className = 'dot';
      progress.appendChild(dot);
    }

    applyTransform();
    preload();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
