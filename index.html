<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mocoa 360° — Copper Giant Resources Corp.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #08090a;
    color: #e0e0e0;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .viewer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1024px;
    max-height: 768px;
    overflow: hidden;
    cursor: grab;
    background: #0a0b0e;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .viewer:active { cursor: grabbing; }

  .viewer img {
    position: absolute;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: auto;
    pointer-events: none;
  }

  .viewer #imgA {
    z-index: 1;
  }
  .viewer #imgB {
    z-index: 2;
    opacity: 0;
  }

  /* Loading */
  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #08090a;
    z-index: 10;
    transition: opacity 0.6s ease;
  }
  .loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loader .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #1a1c20;
    border-top-color: #FF002C;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loader p {
    margin-top: 16px;
    font-size: 13px;
    color: #666;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bottom bar */
  .info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 20px;
    background: linear-gradient(transparent, rgba(8,9,10,0.9));
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #555;
    letter-spacing: 0.5px;
    z-index: 5;
  }
  .info .brand {
    color: #FF002C;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
  }
  .info .position {
    color: #888;
    font-variant-numeric: tabular-nums;
  }
  .info .hint {
    color: #555;
  }
  .info .hint span { display: inline-block; margin-left: 6px; }

  /* Progress dots */
  .progress {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    z-index: 5;
  }
  .progress .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #333;
    transition: background 0.2s;
  }
  .progress .dot.active { background: #FF002C; }

  /* Tap hint */
  .hint-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .hint-overlay.show { opacity: 1; }
  .hint-overlay .arrow {
    font-size: 48px;
    color: rgba(255,255,255,0.08);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translateX(-10px); opacity: 0.08; }
    50% { transform: translateX(10px); opacity: 0.2; }
  }

  @media (max-width: 480px) {
    .info { font-size: 9px; padding: 8px 12px; }
    .info .brand { font-size: 10px; }
    .progress { bottom: 40px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="viewer" id="viewer">
    <img id="imgA" alt="">
    <img id="imgB" alt="">

    <!-- Loading -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Loading Mocoa 360°</p>
    </div>

    <!-- Progress dots -->
    <div class="progress" id="progress"></div>

    <!-- Hint overlay -->
    <div class="hint-overlay" id="hintOverlay">
      <div class="arrow">⟷</div>
    </div>

    <!-- Info bar -->
    <div class="info">
      <span class="brand">Copper Giant Resources Corp.</span>
      <span class="position" id="positionLabel">0°</span>
      <span class="hint">⟵ <span id="dragHint">drag to rotate</span> ⟶</span>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── Configuration ──────────────────────────────────────────
  const TOTAL_FRAMES = 36;       // 10°–360°, step 10°
  const STEP = 10;               // degrees per frame
  const FRAME_NAMES = Array.from({ length: TOTAL_FRAMES }, (_, i) => {
    const deg = (i + 1) * STEP;
    return `${deg}.png`;
  });
  const BASE_PATH = './frames/';

  // ── DOM refs ───────────────────────────────────────────────
  const imgA = document.getElementById('imgA');
  const imgB = document.getElementById('imgB');
  const loader = document.getElementById('loader');
  const progress = document.getElementById('progress');
  const posLabel = document.getElementById('positionLabel');
  const hintOverlay = document.getElementById('hintOverlay');
  const dragHint = document.getElementById('dragHint');

  // ── State ──────────────────────────────────────────────────
  let images = [];               // preloaded Image objects
  let position = 0;              // continuous position (0..TOTAL_FRAMES)
  let prevFrame = 0;             // last drawn integer frame (for imgA)
  let isDragging = false;
  let lastX = 0;
  let velocity = 0;
  let lastTime = 0;
  let rafId = null;
  let inertiaRaf = null;
  let hasInteracted = false;
  let loadedCount = 0;
  let pixelPerFrame = 0;

  // ── Sizing ─────────────────────────────────────────────────
  function calcPixelPerFrame() {
    const w = document.getElementById('viewer').clientWidth;
    pixelPerFrame = Math.max(6, w / TOTAL_FRAMES);
  }

  // ── Render ─────────────────────────────────────────────────
  function render() {
    let pos = ((position % TOTAL_FRAMES) + TOTAL_FRAMES) % TOTAL_FRAMES;
    let idx = Math.floor(pos);
    let blend = pos - idx;

    let frameA = idx % TOTAL_FRAMES;
    let frameB = (idx + 1) % TOTAL_FRAMES;

    // Only update imgA when the integer frame changes
    if (frameA !== prevFrame) {
      imgA.src = BASE_PATH + FRAME_NAMES[frameA];
      prevFrame = frameA;
    }

    // Always update imgB to the next predicted frame
    imgB.src = BASE_PATH + FRAME_NAMES[frameB];
    imgB.style.opacity = blend;

    // Update UI
    const totalDeg = TOTAL_FRAMES * STEP;
    const deg = Math.round((pos / TOTAL_FRAMES) * totalDeg);
    posLabel.textContent = `${deg}°`;

    const dots = progress.querySelectorAll('.dot');
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === frameA);
    });
  }

  // ── Position control ───────────────────────────────────────
  function setPosition(p) {
    position = p;
    render();
  }

  // ── Interaction ────────────────────────────────────────────
  function getX(e) {
    if (e.touches) return e.touches[0].clientX;
    return e.clientX;
  }

  function onPointerDown(e) {
    isDragging = true;
    lastX = getX(e);
    lastTime = performance.now();
    velocity = 0;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (inertiaRaf) cancelAnimationFrame(inertiaRaf);
    inertiaRaf = null;

    if (!hasInteracted) {
      hasInteracted = true;
      hintOverlay.classList.remove('show');
      dragHint.textContent = 'drag to rotate';
    }
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    e.preventDefault();

    const x = getX(e);
    const dx = lastX - x;

    if (Math.abs(dx) > 0.5) {
      setPosition(position + dx / pixelPerFrame);
      lastX = x;
    }

    velocity = dx;
    lastTime = performance.now();
  }

  function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;

    const now = performance.now();
    const dt = Math.min(now - lastTime, 100);

    if (Math.abs(velocity) > 2 && dt > 0) {
      let v = velocity * 0.12;
      const friction = 0.92;

      function inert() {
        v *= friction;
        if (Math.abs(v) < 0.01) {
          inertiaRaf = null;
          return;
        }
        setPosition(position + v);
        inertiaRaf = requestAnimationFrame(inert);
      }
      inert();
    }
  }

  // ── Keyboard ───────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      setPosition(position + (e.key === 'ArrowLeft' ? -1 : 1));
    }
  });

  // ── Preload ────────────────────────────────────────────────
  function preloadFrames() {
    FRAME_NAMES.forEach((name, idx) => {
      const img = new Image();
      img.onload = () => {
        loadedCount++;
        if (loadedCount === TOTAL_FRAMES) {
          loader.classList.add('hidden');
          // Set initial frame
          imgA.src = BASE_PATH + FRAME_NAMES[0];
          prevFrame = 0;
          render();

          if (!hasInteracted) {
            setTimeout(() => hintOverlay.classList.add('show'), 800);
          }
        }
      };
      img.src = BASE_PATH + name;
      images[idx] = img;
    });
  }

  // ── Init ───────────────────────────────────────────────────
  function init() {
    calcPixelPerFrame();
    window.addEventListener('resize', () => { calcPixelPerFrame(); });

    // Mouse
    imgA.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    // Touch
    imgA.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    imgA.addEventListener('contextmenu', e => e.preventDefault());

    // Progress dots
    for (let i = 0; i < TOTAL_FRAMES; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      progress.appendChild(dot);
    }

    preloadFrames();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
